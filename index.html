<script>
(function(){
'use strict';

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const boot = document.getElementById('boot');

let W = 0, H = 0, DPR = 1;
let bg = null;                 // 背景离屏画布

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
}

/* ================= 颜色与光点贴图 ================= */
function hsl2rgb(h, s, l){
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if(h < 60){ r = c; g = x; }
  else if(h < 120){ r = x; g = c; }
  else if(h < 180){ g = c; b = x; }
  else if(h < 240){ g = x; b = c; }
  else if(h < 300){ r = x; b = c; }
  else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function makeGlow(r, g, b, soft){
  const S = 34;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g2 = c.getContext('2d');
  const rg = g2.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  rg.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',1)');
  rg.addColorStop(0.16, 'rgba(' + r + ',' + g + ',' + b + ',' + (0.82 * soft) + ')');
  rg.addColorStop(0.42, 'rgba(' + r + ',' + g + ',' + b + ',' + (0.22 * soft) + ')');
  rg.addColorStop(0.72, 'rgba(' + r + ',' + g + ',' + b + ',' + (0.045 * soft) + ')');
  rg.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
  g2.fillStyle = rg;
  g2.fillRect(0, 0, S, S);
  return c;
}

const SPRITE = [];
function spriteOf(rgb, soft){
  SPRITE.push(makeGlow(rgb[0], rgb[1], rgb[2], soft === undefined ? 1 : soft));
  return SPRITE.length - 1;
}

/* 调色板：松针绿 6 阶 + 金 + 暖白 + 红 + 冰蓝 */
const PAL = [];
[ [105, 58, 16], [116, 62, 21], [126, 66, 27], [136, 72, 34], [146, 78, 42], [110, 46, 13] ]
  .forEach(c => { const rgb = hsl2rgb(c[0], c[1], c[2]); PAL.push({ rgb, i: spriteOf(rgb, 0.9) }); });
const GOLD  = { rgb:[255,201,108], i: spriteOf([255,201,108], 1) };
const GOLDW = { rgb:[255,236,186], i: spriteOf([255,236,186], 1) };
const WARM  = { rgb:[255,248,226], i: spriteOf([255,248,226], 1) };
const RED   = { rgb:[255,86,78],  i: spriteOf([255,86,78], 1) };
const ICE   = { rgb:[176,214,255], i: spriteOf([176,214,255], 1) };

/* ================= 场景参数 ================= */
const TREE = { height: 30, radius: 12.8, baseY: -14 };
const CY = 1.0;                       // 视线中心高度
let dist = 50;                        // 相机距离
let fov = 1.16;                       // 焦距系数

let ay = 0.35;                        // 方位角
let ax = 0.055;                       // 俯仰角
let zoom = 1;
let dragging = false, autoSpin = true;
let lastX = 0, lastY = 0, moved = 0;

/* ================= 生成树 ================= */
const T = { x: [], y: [], z: [], s: [], a: [], pal: [], tw: [] };

function pushPoint(x, y, z, size, alpha, palIdx, twinkle){
  T.x.push(x); T.y.push(y); T.z.push(z);
  T.s.push(size); T.a.push(alpha);
  T.pal.push(palIdx); T.tw.push(twinkle || 0);
}

/* 1. 松针粒子壳体 */
(function foliage(){
  const COUNT = 11500;
  for(let i = 0; i < COUNT; i++){
    const v = Math.pow(Math.random(), 1.34);
    const y = TREE.baseY + v * TREE.height;

    const profile = Math.pow(1 - v, 1.14);
    const tiers = 1 + Math.sin(v * Math.PI * 9) * 0.05 + Math.sin(v * Math.PI * 23) * 0.017;
    const maxR = TREE.radius * profile * tiers;

    const a = Math.random() * Math.PI * 2;
    const frac = 0.50 + Math.pow(Math.random(), 0.58) * 0.50;
    const r = maxR * frac;

    const x = Math.cos(a) * r + (Math.random() - 0.5) * 0.5;
    const z = Math.sin(a) * r + (Math.random() - 0.5) * 0.5;
    const yy = y + (Math.random() - 0.5) * 0.55;

    const p = Math.random();
    let pal, size = 0.30 + Math.random() * 0.36, alpha = 0.16 + Math.random() * 0.16, tw = 0;

    if(p < 0.03){                         // 金色微光
      pal = GOLD.i; size *= 1.5; alpha = 0.5; tw = 1;
    }else if(p < 0.055){                  // 暖白
      pal = WARM.i; size *= 1.15; alpha = 0.34; tw = 1;
    }else if(p < 0.07){                   // 少量红点
      pal = RED.i; size *= 1.2; alpha = 0.3;
    }else{
      const g = Math.random();
      pal = PAL[Math.min(PAL.length - 1, (g * PAL.length) | 0)].i;
    }

    pushPoint(x, yy, z, size, alpha, pal, tw);
  }
})();

/* 2. 金色灯带 */
(function garland(){
  const N = 1100;
  const TURNS = 8;
  for(let i = 0; i < N; i++){
    const u = i / (N - 1);
    const y = TREE.baseY + 0.5 + u * (TREE.height - 1.2);
    const r = TREE.radius * Math.pow(1 - u, 1.14) * 0.88;
    const a = u * Math.PI * 2 * TURNS + 0.6;
    const pick = Math.random();
    let pal, size, alpha;
    if(pick < 0.58){ pal = GOLD.i;  size = 0.34 + Math.random() * 0.42; alpha = 0.40; }
    else if(pick < 0.86){ pal = GOLDW.i; size = 0.30 + Math.random() * 0.38; alpha = 0.44; }
    else { pal = WARM.i; size = 0.34 + Math.random() * 0.46; alpha = 0.38; }
    pushPoint(Math.cos(a) * r, y, Math.sin(a) * r, size, alpha, pal, 2 + Math.random() * 2);
  }
})();

/* 3. 彩球 */
(function ornaments(){
  const N = 74;
  const pool = [RED, GOLD, ICE, GOLDW, [255,120,150], [150,120,255]];
  for(let i = 0; i < N; i++){
    const v = 0.06 + Math.random() * 0.9;
    const y = TREE.baseY + v * TREE.height;
    const r = TREE.radius * Math.pow(1 - v, 1.14) * (0.84 + Math.random() * 0.12);
    const a = Math.random() * Math.PI * 2;
    const p = pool[(Math.random() * pool.length) | 0];
    pushPoint(Math.cos(a) * r, y, Math.sin(a) * r,
              0.55 + Math.random() * 0.6, 0.5,
              Array.isArray(p) ? spriteOf(p, 1) : p.i, 1.4 + Math.random() * 1.6);
  }
})();

/* 3.5 环绕光尘 */
const ORBIT = { r: [], y: [], a: [], sp: [], s: [], al: [], pal: [] };
(function orbitDust(){
  const N = 240;
  for(let i = 0; i < N; i++){
    const v = Math.random();
    ORBIT.r.push(TREE.radius * (0.55 + Math.random() * 0.75));
    ORBIT.y.push(TREE.baseY + v * TREE.height + (Math.random() - 0.5) * 4);
    ORBIT.a.push(Math.random() * Math.PI * 2);
    ORBIT.sp.push((0.06 + Math.random() * 0.22) * (Math.random() < 0.5 ? 1 : -1));
    ORBIT.s.push(0.12 + Math.random() * 0.22);
    ORBIT.al.push(0.22 + Math.random() * 0.3);
    ORBIT.pal.push(Math.random() < 0.6 ? GOLD.i : WARM.i);
  }
})();

/* 4. 树顶星位置 */
const STAR_Y = TREE.baseY + TREE.height + 2.4;

/* ================= 雪 ================= */
const snow = { x: [], y: [], z: [], s: [], sp: [], ph: [] };
(function initSnow(){
  for(let i = 0; i < 1000; i++){
    snow.x.push((Math.random() - 0.5) * 104);
    snow.y.push(TREE.baseY + 8 + Math.random() * 56);
    snow.z.push((Math.random() - 0.5) * 92);
    snow.s.push(0.26 + Math.random() * 0.7);
    snow.sp.push(0.7 + Math.random() * 1.9);
    snow.ph.push(Math.random() * Math.PI * 2);
  }
})();

/* ================= 背景 ================= */
function buildBackground(){
  bg = document.createElement('canvas');
  bg.width = Math.max(1, Math.round(W));
  bg.height = Math.max(1, Math.round(H));
  const g = bg.getContext('2d');

  const sky = g.createRadialGradient(W * 0.5, H * 0.46, 10, W * 0.5, H * 0.46, Math.max(W, H) * 0.78);
  sky.addColorStop(0,   '#0c1a2e');
  sky.addColorStop(0.32,'#081222');
  sky.addColorStop(0.68,'#040811');
  sky.addColorStop(1,   '#020308');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  /* 地面暖光 */
  const scale = H * fov / dist;
  const gy = H * 0.52 + (CY - TREE.baseY) * scale;
  const gr = Math.min(W, H) * 0.34;
  const glow = g.createRadialGradient(W / 2, gy, 0, W / 2, gy, gr);
  glow.addColorStop(0,   'rgba(255,180,92,0.26)');
  glow.addColorStop(0.22,'rgba(255,152,72,0.13)');
  glow.addColorStop(0.55,'rgba(255,140,60,0.045)');
  glow.addColorStop(1,   'rgba(255,140,60,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = glow;
  g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';

  /* 极远处的星空 */
  const starCount = Math.round(W * H / 9000);
  for(let i = 0; i < starCount; i++){
    const x = Math.random() * W;
    const y = Math.random() * H * 0.85;
    const r = Math.random() * 1.1 + 0.2;
    const o = Math.random() * 0.35 + 0.06;
    g.fillStyle = 'rgba(200,220,255,' + o.toFixed(3) + ')';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
}

/* ================= 星形贴图 ================= */
const starSprite = (function(){
  const S = 200;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const r = S / 2;

  const halo = g.createRadialGradient(r, r, 0, r, r, r * 0.95);
  halo.addColorStop(0,    'rgba(255,250,228,0.55)');
  halo.addColorStop(0.08, 'rgba(255,242,200,0.45)');
  halo.addColorStop(0.30, 'rgba(255,222,150,0.22)');
  halo.addColorStop(0.62, 'rgba(255,200,110,0.06)');
  halo.addColorStop(1,    'rgba(255,190,90,0)');
  g.fillStyle = halo;
  g.fillRect(0, 0, S, S);

  g.save();
  g.translate(r, r);
  g.globalCompositeOperation = 'lighter';

  const rays = 12;
  for(let i = 0; i < rays; i++){
    const len = (i % 3 === 0) ? r * 0.97 : (i % 3 === 1 ? r * 0.60 : r * 0.38);
    const wid = (i % 3 === 0) ? 0.030 : 0.017;
    g.save();
    g.rotate(i * Math.PI * 2 / rays);
    const lg = g.createLinearGradient(0, 0, 0, -len);
    lg.addColorStop(0,    'rgba(255,246,214,0.5)');
    lg.addColorStop(0.35, 'rgba(255,226,160,0.2)');
    lg.addColorStop(1,    'rgba(255,210,130,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(-r * wid, -len * 0.96);
    g.lineTo(0, -len);
    g.lineTo(r * wid, -len * 0.96);
    g.closePath();
    g.fill();
    g.restore();
  }

  const core = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.15);
  core.addColorStop(0,   'rgba(255,255,247,1)');
  core.addColorStop(0.4, 'rgba(255,246,208,0.8)');
  core.addColorStop(1,   'rgba(255,226,150,0)');
  g.fillStyle = core;
  g.beginPath();
  g.arc(0, 0, r * 0.15, 0, Math.PI * 2);
  g.fill();
  g.restore();
  return c;
})();

/* ================= 交互 ================= */
let wheelTimer = null;
canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  ay -= dx * 0.0062;
  ax = Math.max(-0.42, Math.min(0.62, ax + dy * 0.0035));
});
function endDrag(){ dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.62, Math.min(2.1, zoom * Math.exp(-e.deltaY * 0.0011)));
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  snowOn = !snowOn;
  btnSnow.classList.toggle('on', snowOn);
});

/* ================= UI ================= */
const btnMusic = document.getElementById('btnMusic');
const btnSnow  = document.getElementById('btnSnow');
const btnSpin  = document.getElementById('btnSpin');
let snowOn = true;

btnSpin.addEventListener('click', () => {
  autoSpin = !autoSpin;
  btnSpin.classList.toggle('on', autoSpin);
});

/* ================= 音乐（WebAudio 铃声） ================= */
const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77
};
const MELODY = [
  ['E5',1],['E5',1],['E5',2],
  ['E5',1],['E5',1],['E5',2],
  ['E5',1],['G5',1],['C5',1.5],['D5',0.5],['E5',3],
  ['F5',1],['F5',1],['F5',1.5],['F5',0.5],
  ['F5',1],['E5',1],['E5',1],['E5',0.5],
  ['D5',1],['D5',1],['E5',1],['D5',2],['G5',2]
];
const BEAT = 0.44;
let actx = null, musicOn = false, musicTimer = null;

function playBell(freq, when, peak){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0006, when + 1.1);
  g.connect(actx.destination);

  const o1 = actx.createOscillator();
  o1.type = 'triangle';
  o1.frequency.setValueAtTime(freq, when);

  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(freq * 2.02, when);
  const g2 = actx.createGain();
  g2.gain.value = 0.3;

  o1.connect(g);
  o2.connect(g2); g2.connect(g);
  o1.start(when); o2.start(when);
  o1.stop(when + 1.25); o2.stop(when + 1.25);
}

function schedule(startAt){
  let t = startAt;
  for(let i = 0; i < MELODY.length; i++){
    const name = MELODY[i][0], beats = MELODY[i][1];
    playBell(NOTE[name], t, name === 'G5' ? 0.062 : 0.045);
    t += beats * BEAT;
  }
  return t;
}

btnMusic.addEventListener('click', () => {
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
  }
  if(musicOn){
    musicOn = false;
    clearTimeout(musicTimer);
    actx.suspend();
    btnMusic.classList.remove('on');
  }else{
    musicOn = true;
    actx.resume();
    const loop = () => {
      if(!musicOn) return;
      const end = schedule(actx.currentTime + 0.06);
      musicTimer = setTimeout(loop, Math.max(60, (end - actx.currentTime - 0.3) * 1000));
    };
    loop();
    btnMusic.classList.add('on');
  }
});

/* ================= 渲染 ================= */
let time = 0;
let last = performance.now();

function render(){
  /* 背景 */
  if(bg) ctx.drawImage(bg, 0, 0, W, H);

  const cA = Math.cos(ay), sA = Math.sin(ay);
  const cE = Math.cos(ax), sE = Math.sin(ax);
  const cenX = W / 2;
  const cenY = H * 0.52;
  const focal = H * fov;
  const d = dist / zoom;

  ctx.globalCompositeOperation = 'lighter';

  /* 树的粒子 */
  const n = T.x.length;
  for(let i = 0; i < n; i++){
    const x = T.x[i], y = T.y[i] - CY, z = T.z[i];

    const X = x * cA - z * sA;
    const Z = x * sA + z * cA;
    const Y = y * cE - Z * sE;
    const zc = y * sE + Z * cE + d;
    if(zc < 2) continue;

    const k = focal / zc;
    const sx = cenX + X * k;
    const sy = cenY - Y * k;

    let size = T.s[i] * k;
    if(size < 0.7) size = 0.7;
    if(size > 46) size = 46;

    let alpha = T.a[i] * (0.7 + 0.3 * (d / zc));
    if(alpha > 1) alpha = 1;

    const tw = T.tw[i];
    if(tw > 0) alpha *= 0.62 + 0.38 * Math.sin(time * tw + i * 0.7);

    const half = size * 0.5;
    if(sx < -size || sx > W + size || sy < -size || sy > H + size) continue;

    ctx.globalAlpha = alpha;
    ctx.drawImage(SPRITE[T.pal[i]], sx - half, sy - half, size, size);
  }

  /* 环绕光尘 */
  {
    const n2 = ORBIT.r.length;
    for(let i = 0; i < n2; i++){
      const ang = ORBIT.a[i] + time * ORBIT.sp[i];
      const x = Math.cos(ang) * ORBIT.r[i];
      const z = Math.sin(ang) * ORBIT.r[i];
      const y = ORBIT.y[i] - CY;

      const X = x * cA - z * sA;
      const Z = x * sA + z * cA;
      const Y = y * cE - Z * sE;
      const zc = y * sE + Z * cE + d;
      if(zc < 2) continue;

      const k = focal / zc;
      const px = cenX + X * k;
      const py = cenY - Y * k;
      const size = ORBIT.s[i] * k;
      ctx.globalAlpha = ORBIT.al[i] * (0.4 + 0.6 * Math.abs(Math.sin(time * 1.3 + i)));
      ctx.drawImage(SPRITE[ORBIT.pal[i]], px - size / 2, py - size / 2, size, size);
    }
  }

  /* 雪 */
  if(snowOn){
    const sn = snow.x.length;
    for(let i = 0; i < sn; i++){
      const sx0 = snow.x[i];
      const sy0 = snow.y[i] - CY;
      const sz0 = snow.z[i];

      const X = sx0 * cA - sz0 * sA;
      const Z = sx0 * sA + sz0 * cA;
      const Y = sy0 * cE - Z * sE;
      const zc = sy0 * sE + Z * cE + d;
      if(zc < 2) continue;

      const k = focal / zc;
      const px = cenX + X * k;
      const py = cenY - Y * k;
      const size = snow.s[i] * k;
      if(size < 0.5) continue;

      ctx.globalAlpha = 0.30;
      ctx.drawImage(SPRITE[WARM.i], px - size / 2, py - size / 2, size, size);
    }
  }

  /* 树顶星 */
  {
    const y = STAR_Y - CY;
    const X = 0, Z = 0;
    const Y = y * cE - Z * sE;
    const zc = y * sE + Z * cE + d;
    const k = focal / zc;
    const px = cenX, py = cenY - Y * k;
    const pulse = 1 + Math.sin(time * 1.7) * 0.07;
    const size = 6.2 * k * pulse;
    const halo = size * 1.9;
    ctx.globalAlpha = 0.42 + Math.sin(time * 1.7) * 0.1;
    ctx.drawImage(SPRITE[GOLD.i], px - halo / 2, py - halo / 2, halo, halo);
    ctx.globalAlpha = 0.92;
    ctx.drawImage(starSprite, px - size / 2, py - size / 2, size, size);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  time += dt;

  if(autoSpin && !dragging) ay += dt * 0.11;

  /* 雪下落（世界坐标） */
  if(snowOn){
    for(let i = 0; i < snow.y.length; i++){
      snow.y[i] -= snow.sp[i] * dt * 1.5;
      if(snow.y[i] < TREE.baseY - 6) snow.y[i] = TREE.baseY + 58;
      snow.x[i] += Math.cos(time * 0.6 + snow.ph[i]) * dt * 1.6;
    }
  }

  render();
  requestAnimationFrame(frame);
}

/* ================= 启动 ================= */
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

setTimeout(function(){
  boot.classList.add('gone');
  setTimeout(function(){ if(boot.parentNode) boot.remove(); }, 1000);
}, 380);

})();
</script>
