<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merry Christmas</title>
<meta name="description" content="A particle Christmas tree that gathers out of the dark, with photographs hanging on its branches that surface as you move closer.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#06080c;overflow:hidden;}
  body{
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    color:#efe6d6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  canvas#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;}

  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(130% 100% at 50% 46%,transparent 34%,rgba(3,5,9,.42) 72%,rgba(2,3,6,.86) 100%);
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.9'/></svg>");
    background-size:160px 160px;
  }

  .masthead{
    position:fixed;top:clamp(24px,6vh,76px);left:0;right:0;text-align:center;
    z-index:5;pointer-events:none;
    opacity:0;transform:translateY(8px);
    transition:opacity 1.6s cubic-bezier(.2,.7,.2,1),transform 1.6s cubic-bezier(.2,.7,.2,1);
  }
  .masthead.on{opacity:1;transform:none;}
  .masthead.dim{opacity:0;transform:translateY(-10px);}
  h1{
    font-size:clamp(17px,2.55vw,28px);font-weight:400;
    letter-spacing:.34em;text-indent:.34em;
    color:#f2ead9;
  }

  .controls{
    position:fixed;left:0;right:0;bottom:clamp(34px,5.4vh,58px);
    display:flex;align-items:center;justify-content:center;gap:clamp(22px,3.2vw,42px);
    z-index:6;opacity:0;transition:opacity 1.2s ease;
  }
  .controls.on{opacity:1;}
  .controls button{
    appearance:none;border:0;background:none;cursor:pointer;
    font-family:inherit;font-size:11px;letter-spacing:.24em;text-indent:.24em;
    color:#e8dfcc;opacity:.4;padding:6px 1px 7px;position:relative;
    transition:opacity .45s ease;
  }
  .controls button:hover{opacity:.82;}
  .controls button[data-on="1"]{opacity:.9;}
  .controls button[data-on="1"]::after{
    content:"";position:absolute;left:1px;right:1px;bottom:0;height:1px;
    background:rgba(198,160,100,.5);
  }
  .controls button#btnPhotos{opacity:.78;}
  .controls button#btnPhotos::before{
    content:"";position:absolute;left:-10px;top:50%;width:3px;height:3px;
    margin-top:-1.5px;border-radius:50%;background:rgba(198,160,100,.6);
  }

  .hint{
    position:fixed;left:0;right:0;bottom:clamp(12px,2.2vh,20px);
    text-align:center;font-size:10px;letter-spacing:.22em;
    color:rgba(222,210,189,.26);z-index:6;opacity:0;transition:opacity 1s ease;
  }
  .hint.on{opacity:1;}

  /* ---- 照片面板 ---- */
  .panel{
    position:fixed;inset:0;z-index:12;
    display:flex;align-items:center;justify-content:center;
    background:rgba(3,5,8,.74);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:opacity .45s ease;
  }
  .panel.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:min(680px,90vw);max-height:84vh;overflow:auto;
    background:linear-gradient(180deg,#0b0f14 0%,#080a0e 100%);
    border:1px solid rgba(198,160,100,.16);
    padding:30px clamp(20px,3.2vw,34px) 26px;
    box-shadow:0 36px 90px rgba(0,0,0,.6);
    transform:translateY(12px);transition:transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .panel.open .sheet{transform:none;}
  .sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
  .sheet-head h2{font-size:15px;font-weight:400;letter-spacing:.24em;color:#efe6d6;}
  .sheet-head button{
    appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
    font-size:11px;letter-spacing:.2em;color:rgba(232,222,204,.55);padding:2px 0 3px;
    border-bottom:1px solid rgba(232,222,204,.18);transition:.35s;
  }
  .sheet-head button:hover{color:#f2ead9;border-color:rgba(198,160,100,.7);}
  .sheet-desc{margin-top:12px;font-size:11px;line-height:2.05;letter-spacing:.05em;color:rgba(232,222,204,.4);}
  .sheet-grid{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{
    position:relative;aspect-ratio:3/2;background:#101720;overflow:hidden;cursor:pointer;
    border:1px solid rgba(232,222,204,.12);transition:border-color .3s ease,transform .3s ease;
  }
  .tile:hover{border-color:rgba(198,160,100,.5);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .idx{
    position:absolute;left:6px;bottom:5px;font-size:9px;letter-spacing:.12em;
    color:rgba(255,255,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .tile .drop{
    position:absolute;right:5px;top:5px;width:18px;height:18px;display:none;
    align-items:center;justify-content:center;padding:0;font-size:11px;line-height:1;
    color:rgba(255,255,255,.72);background:rgba(0,0,0,.42);border:0;border-radius:50%;cursor:pointer;
  }
  .tile:hover .drop{display:flex;}
  .tile.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;}
  .tile.empty .plus{font-size:17px;line-height:1;color:rgba(198,160,100,.46);}
  .tile.empty .lab{font-size:9px;letter-spacing:.2em;color:rgba(232,222,204,.26);}
  .tile.seed::after{
    content:"示例";position:absolute;left:5px;top:4px;font-size:9px;letter-spacing:.08em;
    color:rgba(255,255,255,.66);background:rgba(0,0,0,.36);padding:1px 5px 2px;
    line-height:1.35;
  }

  /* ---- 单张查看 ---- */
  .viewer{
    position:fixed;inset:0;z-index:14;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#03050a;opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  .viewer.open{opacity:1;pointer-events:auto;}
  .viewer img{
    max-width:min(86vw,980px);max-height:72vh;display:block;
    box-shadow:0 34px 80px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.05);
  }
  .viewer p{font-size:10px;letter-spacing:.24em;color:rgba(232,222,204,.4);}
  .viewer button{
    appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
    font-size:10px;letter-spacing:.24em;color:rgba(232,222,204,.55);padding:2px 0 4px;
    border-bottom:1px solid rgba(232,222,204,.18);transition:.35s;
  }
  .viewer button:hover{color:#f2ead9;border-color:rgba(198,160,100,.7);}

  #boot{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#06080c;z-index:20;transition:opacity 1.1s ease;
    font-size:11px;letter-spacing:.26em;color:rgba(222,210,189,.42);
  }
  #boot.gone{opacity:0;pointer-events:none;}

  @media (max-width:640px){
    .controls{bottom:34px;gap:20px;}
    .controls button{font-size:10.5px;letter-spacing:.18em;text-indent:.18em;}
    .controls button#btnPhotos::before{left:-7px;}
    .hint{bottom:12px;font-size:9px;letter-spacing:.16em;}
    .panel{align-items:flex-end;}
    .sheet{
      width:100%;max-height:78vh;border-left:0;border-right:0;border-bottom:0;
      padding:22px 18px 30px;transform:translateY(26px);
    }
    .sheet-grid{grid-template-columns:repeat(2,1fr);gap:9px;}
    .tile .drop{display:flex;background:rgba(0,0,0,.34);}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<header class="masthead" id="masthead">
  <h1>Merry Christmas</h1>
</header>

<nav class="controls" id="controls">
  <button id="btnPhotos">照片</button>
  <button id="btnSnow" data-on="1">飘雪</button>
  <button id="btnSpin" data-on="1">旋转</button>
  <button id="btnMusic" data-on="0">铃声</button>
</nav>

<div class="hint" id="hint">拖动旋转 · 滚轮靠近 · 双击落雪</div>

<div class="panel" id="panel">
  <div class="sheet">
    <div class="sheet-head">
      <h2>树上的照片</h2>
      <button id="panelClose">完成</button>
    </div>
    <p class="sheet-desc">把照片放进下面的格子，它们会挂在枝头。滚动滚轮靠近圣诞树，照片才会从枝叶里浮出来。</p>
    <div class="sheet-grid" id="grid"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewerImg" alt="">
  <p id="viewerCap"></p>
  <button id="viewerClose">关闭</button>
</div>

<input type="file" id="file" accept="image/*" hidden>

<div id="boot">让光慢慢聚拢<span class="dot">…</span></div>

<script>
(function(){
'use strict';

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const boot = document.getElementById('boot');

let W = 0, H = 0, DPR = 1, bg = null;

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
}

/* ================= 色彩 ================= */
function hsl(h, s, l){
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if(h < 60){ r = c; g = x; }
  else if(h < 120){ r = x; g = c; }
  else if(h < 180){ g = c; b = x; }
  else if(h < 240){ g = x; b = c; }
  else if(h < 300){ r = x; b = c; }
  else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function glowSprite(rgb, spread){
  const S = 40;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  rg.addColorStop(0,    'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',1)');
  rg.addColorStop(0.15, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.8 * spread) + ')');
  rg.addColorStop(0.42, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.16 * spread) + ')');
  rg.addColorStop(0.72, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.03 * spread) + ')');
  rg.addColorStop(1,    'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, S, S);
  return c;
}

const SPR = [];
function sprite(rgb, spread){
  SPR.push(glowSprite(rgb, spread === undefined ? 1 : spread));
  return SPR.length - 1;
}

/* 松针不是光点，而是一小簇针叶：换掉圆形光斑，树才不像一团雾 */
const TUFT = [];
function tuftSprite(rgb, seed){
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  g.lineCap = 'round';

  /* 不要均匀放射，长短、角度都错开，才不会看成小雪花 */
  const n = 8;
  for(let k = 0; k < n; k++){
    const ang = Math.random() * Math.PI * 2 + seed * 1.1;
    const len = 7 + Math.pow(Math.random(), 1.35) * 19;
    const bend = (Math.random() - 0.5) * 9;
    const alpha = 0.28 + Math.random() * 0.42;
    const ox = (Math.random() - 0.5) * 5, oy = (Math.random() - 0.5) * 5;
    g.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha.toFixed(3) + ')';
    g.lineWidth = 1.15 + Math.random() * 0.85;
    g.beginPath();
    g.moveTo(ox, oy);
    g.quadraticCurveTo(
      ox + Math.cos(ang) * len * 0.55 - Math.sin(ang) * bend,
      oy + Math.sin(ang) * len * 0.55 + Math.cos(ang) * bend,
      ox + Math.cos(ang) * len,
      oy + Math.sin(ang) * len
    );
    g.stroke();
  }
  TUFT.push(c);
  return TUFT.length - 1;
}

/* 松针：低饱和的墨绿，只留一点层次 */
const PINE = [];
[ [128, 15, 9], [132, 17, 12], [136, 19, 15], [140, 21, 19], [130, 16, 23], [144, 23, 27] ]
  .forEach(function(c){
    const rgb = hsl(c[0], c[1], c[2]);
    PINE.push({
      rgb: rgb,
      i: sprite(rgb, 0.62),
      t: [tuftSprite(rgb, 0), tuftSprite(rgb, 1), tuftSprite(rgb, 2)]
    });
  });

const IVORY = { rgb: [238, 229, 210], i: sprite([238, 229, 210], 0.85) };
const GOLD  = { rgb: [198, 160, 100], i: sprite([198, 160, 100], 0.95) };
const WINE  = { rgb: [132, 48, 42],   i: sprite([132, 48, 42], 0.8) };

/* ================= 树 ================= */
const TREE = { h: 30, r: 12.4, base: -14 };
const CY = 1.0;

const T = { n: 0, rT: [], aT: [], yT: [], r0: [], a0: [], y0: [], ca: [], sa: [],
            sz: [], al: [], co: [], d: [], tw: [], fx: [], fy: [], inF: [], ee: [], tv: [] };

function perimeterUnit(s){
  if(s < 1.5) return [s / 1.5, 0];
  if(s < 2.5) return [1, s - 1.5];
  if(s < 4.0) return [1 - (s - 2.5) / 1.5, 1];
  return [0, 1 - (s - 4.0)];
}

function addTreePoint(rT, aT, yT, r0, a0, y0, size, alpha, co, delay, twinkle){
  const i = T.n++;
  T.rT.push(rT); T.aT.push(aT); T.yT.push(yT);
  T.r0.push(r0); T.a0.push(a0); T.y0.push(y0);
  T.ca.push(Math.cos(aT)); T.sa.push(Math.sin(aT));
  T.sz.push(size); T.al.push(alpha); T.co.push(co);
  T.d.push(delay); T.tw.push(twinkle || 0); T.ee.push(0); T.tv.push((Math.random() * 3) | 0);

  const inFrame = Math.random() < 0.16;
  T.inF.push(inFrame);
  if(inFrame){
    T.fx.push(0.08 + Math.random() * 0.84);
    T.fy.push(0.08 + Math.random() * 0.84);
  }else{
    const u = perimeterUnit(Math.random() * 5);
    T.fx.push(u[0]);
    T.fy.push(u[1]);
  }
  return i;
}

/* 1. 树身：先铺体积，再压枝条，最后勾一圈轮廓 */
(function foliage(){
  const SMALL = Math.min(innerWidth, innerHeight) < 620;
  const COUNT = SMALL ? 5200 : 7600;
  for(let i = 0; i < COUNT; i++){
    const v = Math.pow(Math.random(), 1.22);
    const y = TREE.base + v * TREE.h;

    const profile = Math.pow(1 - v, 1.06);
    const tier = 1 + Math.sin(v * Math.PI * 9) * 0.03 + Math.sin(v * Math.PI * 23) * 0.01;
    const maxR = TREE.r * profile * tier;

    const a = Math.random() * Math.PI * 2;
    const u = Math.pow(Math.random(), 0.55);
    const r = maxR * (0.24 + u * 0.78);

    let co = PINE[(Math.random() * PINE.length) | 0].i;
    let size = 0.34 + Math.random() * 0.38;
    let alpha = 0.42 + 0.26 * (u * u);
    let tw = 0;

    const q = Math.random();
    if(q < 0.02){ co = GOLD.i; size *= 1.3; alpha = 0.5; tw = 1; }
    else if(q < 0.036){ co = IVORY.i; size *= 1.02; alpha = 0.32; tw = 1; }
    else if(q < 0.046){ co = WINE.i; size *= 1.08; alpha = 0.3; }

    addTreePoint(
      r, a, y,
      20 + Math.random() * 34, a + (Math.random() - 0.5) * 3.4,
      TREE.base - 8 + Math.random() * (TREE.h + 26),
      size, alpha, co,
      (1 - v) * 0.55 + Math.random() * 0.55, tw
    );
  }

  /* 枝条：每层一小簇，向外微微下垂，让轮廓不是一条光滑的锥线 */
  const TIERS = SMALL ? 14 : 19, PER = SMALL ? 165 : 210;
  for(let ti = 0; ti < TIERS; ti++){
    const v = 0.10 + (ti / TIERS) * 0.86;
    const yTop = TREE.base + v * TREE.h;
    const profile = Math.pow(1 - v, 1.06);
    const maxR = TREE.r * profile;
    const spread = ti * 2.39996 + 0.35;

    for(let j = 0; j < PER; j++){
      const u = Math.pow(Math.random(), 0.62);
      const a = spread + (Math.random() - 0.5) * 1.05;
      const r = maxR * (0.14 + u * 0.86);
      const y = yTop - (u * u) * (0.45 + Math.random() * 1.25);

      let co = PINE[(Math.random() * PINE.length) | 0].i;
      let size = 0.30 + Math.random() * 0.36;
      let alpha = 0.34 + 0.26 * u;
      let tw = 0;
      if(Math.random() < 0.05){ co = IVORY.i; alpha = 0.34; tw = 1; }

      addTreePoint(
        r, a, y,
        22 + Math.random() * 30, a + (Math.random() - 0.5) * 3,
        TREE.base - 8 + Math.random() * (TREE.h + 26),
        size, alpha, co,
        (1 - v) * 0.55 + Math.random() * 0.5, tw
      );
    }
  }

  /* 轮廓：一圈更亮一点的松针，把形状托出来 */
  const RIM = SMALL ? 520 : 720;
  for(let i = 0; i < RIM; i++){
    const v = Math.pow(Math.random(), 1.15);
    const y = TREE.base + v * TREE.h;
    const profile = Math.pow(1 - v, 1.06);
    const maxR = TREE.r * profile;
    const a = Math.random() * Math.PI * 2;
    const r = maxR * (0.92 + Math.random() * 0.1);

    const q = Math.random();
    const co = q < 0.07 ? GOLD.i : (q < 0.16 ? IVORY.i : PINE[2 + ((Math.random() * 4) | 0)].i);

    addTreePoint(
      r, a, y,
      20 + Math.random() * 30, a + (Math.random() - 0.5) * 3,
      TREE.base - 8 + Math.random() * (TREE.h + 26),
      0.36 + Math.random() * 0.32, 0.50 + Math.random() * 0.24, co,
      (1 - v) * 0.55 + Math.random() * 0.5, q < 0.16 ? 1 : 0
    );
  }
})();

/* 2. 灯带：不去做满圈的金线，让光点疏密不均地绕上去 */
(function garland(){
  const N = Math.min(innerWidth, innerHeight) < 620 ? 430 : 560, TURNS = 4.55;
  for(let i = 0; i < N; i++){
    const u = i / (N - 1);
    const y = TREE.base + 0.6 + u * (TREE.h - 1.2);
    const a = u * Math.PI * 2 * TURNS + 0.9;
    const r = TREE.r * Math.pow(1 - u, 1.06) * (0.84 + Math.sin(u * 17) * 0.07);

    const pick = Math.random();
    let co, size, alpha;
    if(pick < 0.5){ co = GOLD.i; size = 0.20 + Math.random() * 0.26; alpha = 0.38 + Math.random() * 0.22; }
    else if(pick < 0.82){ co = IVORY.i; size = 0.18 + Math.random() * 0.24; alpha = 0.42 + Math.random() * 0.22; }
    else { co = WINE.i; size = 0.20 + Math.random() * 0.24; alpha = 0.24; }

    /* 每七八颗里有一颗更亮的，光才不至于连成一条线 */
    if(i % 7 === 0){ size *= 1.45; alpha *= 1.45; }

    addTreePoint(
      r, a, y,
      18 + Math.random() * 30, a + (Math.random() - 0.5) * 3,
      TREE.base - 10 + Math.random() * (TREE.h + 30),
      size, alpha, co,
      0.35 + u * 0.9 + Math.random() * 0.4, 1.8 + Math.random() * 1.2
    );
  }
})();

/* 3. 挂灯 */
(function ornaments(){
  const N = 46;
  for(let i = 0; i < N; i++){
    const v = 0.05 + Math.random() * 0.9;
    const y = TREE.base + v * TREE.h;
    const r = TREE.r * Math.pow(1 - v, 1.12) * (0.82 + Math.random() * 0.1);
    const a = Math.random() * Math.PI * 2;
    const pick = Math.random();
    const co = pick < 0.45 ? GOLD.i : (pick < 0.85 ? WINE.i : IVORY.i);
    addTreePoint(
      r, a, y,
      16 + Math.random() * 28, a + (Math.random() - 0.5) * 2,
      TREE.base - 6 + Math.random() * (TREE.h + 20),
      0.62 + Math.random() * 0.55, 0.55, co,
      0.6 + Math.random() * 1.2, 1.2 + Math.random() * 1.2
    );
  }
})();

/* ================= 雪 ================= */
const SNOW = { x: [], y: [], z: [], s: [], sp: [], ph: [] };
(function initSnow(){
  for(let i = 0; i < 760; i++){
    SNOW.x.push((Math.random() - 0.5) * 96);
    SNOW.y.push(TREE.base + 2 + Math.random() * 52);
    SNOW.z.push((Math.random() - 0.5) * 80);
    SNOW.s.push(0.12 + Math.random() * 0.26);
    SNOW.sp.push(0.7 + Math.random() * 1.5);
    SNOW.ph.push(Math.random() * Math.PI * 2);
  }
})();

/* ================= 背景 ================= */
function buildBackground(){
  bg = document.createElement('canvas');
  bg.width = Math.max(1, Math.round(W));
  bg.height = Math.max(1, Math.round(H));
  const g = bg.getContext('2d');

  const sky = g.createRadialGradient(W * 0.5, H * 0.46, 8, W * 0.5, H * 0.46, Math.max(W, H) * 0.8);
  sky.addColorStop(0,   '#0a0f16');
  sky.addColorStop(0.34,'#070b11');
  sky.addColorStop(0.7, '#040609');
  sky.addColorStop(1,   '#020305');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  const scale = H * 1.12 / 50;
  const gy = H * 0.52 + (CY - TREE.base) * scale;

  const pool = g.createRadialGradient(W / 2, gy + 8, 0, W / 2, gy + 8, Math.min(W, H) * 0.34);
  pool.addColorStop(0,   'rgba(255,196,120,0.09)');
  pool.addColorStop(0.35,'rgba(255,180,110,0.03)');
  pool.addColorStop(1,   'rgba(255,170,100,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = pool;
  g.fillRect(0, 0, W, H);

  /* 树身内侧的一点暖光，让整棵树不至于发冷 */
  const core = g.createRadialGradient(W / 2, gy - 250, 0, W / 2, gy - 250, Math.min(W, H) * 0.26);
  core.addColorStop(0,   'rgba(255,186,116,0.055)');
  core.addColorStop(0.45,'rgba(255,178,108,0.022)');
  core.addColorStop(1,   'rgba(255,170,100,0)');
  g.fillStyle = core;
  g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';

  /* 落地的影子，树才站得住 */
  g.save();
  g.translate(W / 2, gy + 10);
  g.scale(1, 0.13);
  const shade = g.createRadialGradient(0, 0, 0, 0, 0, Math.max(120, W * 0.155));
  shade.addColorStop(0,   'rgba(0,0,0,0.40)');
  shade.addColorStop(0.55,'rgba(0,0,0,0.14)');
  shade.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = shade;
  g.beginPath();
  g.arc(0, 0, Math.max(120, W * 0.155), 0, Math.PI * 2);
  g.fill();
  g.restore();

  const dark = g.createRadialGradient(W / 2, gy + 6, 0, W / 2, gy + 6, Math.min(W, H) * 0.42);
  dark.addColorStop(0, 'rgba(0,0,0,0.32)');
  dark.addColorStop(0.6,'rgba(0,0,0,0.1)');
  dark.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = dark;
  g.fillRect(0, 0, W, H);

  const n = Math.round(W * H / 16000);
  for(let i = 0; i < n; i++){
    const x = Math.random() * W;
    const y = Math.random() * H * 0.8;
    const rr = Math.random() * 0.9 + 0.25;
    const o = Math.random() * 0.22 + 0.05;
    g.fillStyle = 'rgba(214,224,236,' + o.toFixed(3) + ')';
    g.beginPath();
    g.arc(x, y, rr, 0, Math.PI * 2);
    g.fill();
  }
}

/* ================= 星 ================= */
const starSprite = (function(){
  const S = 260;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const r = S / 2;

  const halo = g.createRadialGradient(r, r, 0, r, r, r);
  halo.addColorStop(0,   'rgba(255,238,206,0.24)');
  halo.addColorStop(0.18,'rgba(255,226,178,0.09)');
  halo.addColorStop(0.55,'rgba(255,214,158,0.025)');
  halo.addColorStop(1,   'rgba(255,208,150,0)');
  g.fillStyle = halo;
  g.fillRect(0, 0, S, S);

  g.translate(r, r);

  /* 两缕极淡的竖向光晕，只是让星点周围有一点空气感 */
  g.globalCompositeOperation = 'lighter';
  const rayLen = r * 0.5;
  for(let i = 0; i < 2; i++){
    g.save();
    g.rotate(i * Math.PI / 2);
    const lg = g.createLinearGradient(0, 0, 0, -rayLen);
    lg.addColorStop(0,   'rgba(255,240,208,0.18)');
    lg.addColorStop(0.5, 'rgba(255,228,180,0.04)');
    lg.addColorStop(1,   'rgba(255,222,170,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(-1.2, -rayLen * 0.98); g.lineTo(0, -rayLen); g.lineTo(1.2, -rayLen * 0.98);
    g.closePath(); g.fill();
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';

  /* 五角星本体 */
  const R = r * 0.30, ri = R * 0.44;
  g.beginPath();
  for(let k = 0; k < 10; k++){
    const ang = -Math.PI / 2 + k * Math.PI / 5;
    const rad = (k % 2 === 0) ? R : ri;
    const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
    if(k === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();

  const goldGrad = g.createLinearGradient(0, -R, 0, R);
  goldGrad.addColorStop(0,   'rgba(255,250,234,1)');
  goldGrad.addColorStop(0.55,'rgba(255,238,201,0.96)');
  goldGrad.addColorStop(1,   'rgba(236,192,132,0.84)');
  g.fillStyle = goldGrad;
  g.shadowColor = 'rgba(255,226,170,0.5)';
  g.shadowBlur = r * 0.14;
  g.fill();

  return c;
})();

const STAR_Y = TREE.base + TREE.h + 0.85;

/* ================= 状态 ================= */
let ay = 0.62, ax = 0.075;
let zoom = 1, targetZoom = 1, dist = 50, fov = 1.12;
let dragging = false, autoSpin = true, snowOn = true;
let lastX = 0, lastY = 0;
let t = 0;
let ayGoal = null;
const pointers = new Map();
let pinchStart = 0, pinchZoom = 1;

const isSmall = function(){ return Math.min(W, H) < 620; };

/* ================= 枝头的照片 ================= */
const MAX_PHOTOS = 8;
const STORE_KEY = 'christmas-tree-v176-photos';
const PHOTO = {
  img: new Array(MAX_PHOTOS).fill(null),
  src: new Array(MAX_PHOTOS).fill(null),
  seed: new Array(MAX_PHOTOS).fill(false)
};

/* 每张照片的位置：方位角 a、高度 v、离树面的系数 rf、画幅宽 w、倾角 */
const SLOTS = [
  { a: 0.42, v: 0.40, rf: 1.06, w: 7.6, tilt: -0.05 },
  { a: 1.20, v: 0.62, rf: 1.04, w: 6.6, tilt:  0.05 },
  { a: 2.00, v: 0.31, rf: 1.08, w: 8.2, tilt:  0.02 },
  { a: 2.80, v: 0.53, rf: 1.05, w: 7.0, tilt: -0.04 },
  { a: 3.60, v: 0.38, rf: 1.07, w: 7.8, tilt:  0.04 },
  { a: 4.40, v: 0.60, rf: 1.04, w: 6.4, tilt: -0.02 },
  { a: 5.20, v: 0.46, rf: 1.06, w: 7.4, tilt:  0.05 },
  { a: 6.00, v: 0.67, rf: 1.03, w: 6.8, tilt: -0.05 }
];

const photoHit = [];

function smooth01(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

/* ================= 渲染 ================= */
let introFast = false;

function render(){
  if(bg) ctx.drawImage(bg, 0, 0, W, H);

  const cosA = Math.cos(ay), sinA = Math.sin(ay);
  const cosE = Math.cos(ax), sinE = Math.sin(ax);
  const cx = W / 2, cy = H * 0.52;
  const focal = H * fov;
  const d = dist / zoom;
  const reveal = smooth01((zoom - 1.36) / 0.22);

  ctx.globalCompositeOperation = 'lighter';

  /* 雪先落，落在树的后面，前景才干净 */
  if(snowOn){
    const snowA = 0.13;
    for(let i = 0; i < SNOW.x.length; i++){
      const wx = SNOW.x[i], wy = SNOW.y[i] - CY, wz = SNOW.z[i];
      const X = wx * cosA - wz * sinA;
      const Z = wx * sinA + wz * cosA;
      const Y = wy * cosE - Z * sinE;
      const zc = wy * sinE + Z * cosE + d;
      if(zc < 2) continue;

      const k = focal / zc;
      const px = cx + X * k, py = cy - Y * k;
      const size = SNOW.s[i] * k;
      if(size < 0.4) continue;

      ctx.globalAlpha = snowA;
      ctx.drawImage(SPR[IVORY.i], px - size / 2, py - size / 2, size, size);
    }
  }

  const n = T.n;
  for(let i = 0; i < n; i++){
    let r, y, ang, e = 1;

    if(!introFast && t < 5.6){
      const q = (t - T.d[i]) / 1.7;
      e = q <= 0 ? 0 : (q >= 1 ? 1 : 1 - Math.pow(1 - q, 3));
      r = T.r0[i] + (T.rT[i] - T.r0[i]) * e;
      y = T.y0[i] + (T.yT[i] - T.y0[i]) * e;
      ang = T.aT[i] + ay + (1 - e) * 3.6;
    }else{
      r = T.rT[i];
      y = T.yT[i];
      ang = 0;
    }

    let x, z;
    if(ang !== 0){
      x = Math.cos(ang) * r;
      z = Math.sin(ang) * r;
    }else{
      x = (T.ca[i] * cosA - T.sa[i] * sinA) * r;
      z = (T.ca[i] * sinA + T.sa[i] * cosA) * r;
    }

    const yy = y - CY;
    const X = x * cosA - z * sinA;
    const Z = x * sinA + z * cosA;
    const Y = yy * cosE - Z * sinE;
    const zc = yy * sinE + Z * cosE + d;
    if(zc < 2) continue;

    const k = focal / zc;
    let sx = cx + X * k;
    let sy = cy - Y * k;

    let size = T.sz[i] * k * (0.32 + 0.68 * e);
    if(size > 44) size = 44;
    if(size < 0.65) size = 0.65;

    let alpha = T.al[i] * (0.62 + 0.38 * e);

    /* 树尖太密会泛白，压一点 */
    const vt = (T.yT[i] - TREE.base) / TREE.h;
    if(vt > 0.88) alpha *= 0.5 + (1 - vt) * 3.4;

    /* 深度：靠前的松针亮一点，靠后的沉下去，树才有体积 */
    const front = Math.max(0, Math.min(1, (d - zc) / 62));
    alpha *= 0.82 + 0.24 * front;

    const tw = T.tw[i];
    if(tw > 0) alpha *= 0.66 + 0.34 * Math.sin(t * tw + i * 0.8);

    if(alpha <= 0.01) continue;
    if(sx < -size || sx > W + size || sy < -size || sy > H + size) continue;

    const co = T.co[i];
    const useTuft = co < 6 && e > 0.45;
    if(useTuft){
      const want = size * (1.85 + T.tv[i] * 0.32);
      if(want > 21){ alpha *= Math.pow(21 / want, 0.55); size = 21; } else size = want;
    }
    const half = size * 0.5;
    ctx.globalAlpha = alpha > 1 ? 1 : alpha;
    ctx.drawImage(useTuft ? TUFT[co * 3 + T.tv[i]] : SPR[co], sx - half, sy - half, size, size);
  }

  /* 星 */
  {
    const yy = STAR_Y - CY;
    const Y = yy * cosE;
    const zc = yy * sinE + d;
    const k = focal / zc;
    const px = cx, py = cy - Y * k;

    let ignite = 1;
    if(t < 3.05) ignite = 0;
    else if(t < 3.7) ignite = (t - 3.05) / 0.65;

    const pulse = 1 + Math.sin(t * 1.25) * 0.05;
    const size = 4.05 * k * pulse * (0.35 + 0.65 * ignite);
    const aStar = 0.78 * ignite;

    if(aStar > 0.02){
      ctx.globalAlpha = aStar;
      ctx.drawImage(starSprite, px - size / 2, py - size / 2, size, size);
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawPhotos(cx, cy, focal, d, cosA, sinA, cosE, sinE, reveal);
}

function drawCover(img, x, y, w, h){
  const ir = img.width / img.height, r = w / h;
  let sw, sh, sx, sy;
  if(ir > r){ sh = img.height; sw = sh * r; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / r; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

/* ================= 枝头照片 ================= */
function drawPhotos(cx, cy, focal, d, cosA, sinA, cosE, sinE, reveal){
  photoHit.length = 0;
  if(reveal <= 0.004) return;

  const items = [];
  for(let i = 0; i < MAX_PHOTOS; i++){
    const img = PHOTO.img[i];
    if(!img || !img.width || !img.height) continue;

    const s = SLOTS[i];
    const ang = s.a + ay;
    const r = TREE.r * Math.pow(1 - s.v, 1.06) * s.rf;
    const x = Math.cos(s.a) * r;
    const z = Math.sin(s.a) * r;
    const yy = TREE.base + s.v * TREE.h - CY;

    const X = x * cosA - z * sinA;
    const Z = x * sinA + z * cosA;
    const Y = yy * cosE - Z * sinE;
    const zc = yy * sinE + Z * cosE + d;
    if(zc < 8) continue;

    const k = focal / zc;
    const px0 = cx + X * k;
    const py0 = cy - Y * k;

    /* 正对镜头为 1，转到树后为 -1，背面就收起来 */
    const facing = Math.sin(ang);
    if(facing < 0.02) continue;

    let w = s.w * k * (0.34 + 0.66 * facing) * (0.84 + 0.16 * reveal);
    const maxW = isSmall() ? W * 0.44 : W * 0.30;
    if(w > maxW) w = maxW;
    const ar = Math.max(0.66, Math.min(1.5, (img.width || 1.5) / (img.height || 1)));
    const h = w / ar;
    if(w < 6) continue;

    /* 贴近边缘时把相片往里收一点，别被屏幕切掉 */
    const px = Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, px0));
    const py = Math.max(h / 2 + 8, Math.min(H - h / 2 - 48, py0));

    items.push({
      x: px, y: py, w: w, h: h, zc: zc, img: img, i: i,
      a: Math.pow(reveal, 0.55) * (0.75 + 0.25 * facing) * Math.min(1, facing / 0.16),
      rot: s.tilt + Math.sin(t * 0.55 + i * 1.7) * 0.014
    });
  }

  items.sort(function(p, q){ return q.zc - p.zc; });

  for(let q = 0; q < items.length; q++){
    const it = items[q];

    /* 照片浮出来的那一下，几粒金色光点往照片里收 */
    if(reveal < 0.995){
      const f = 1 - reveal;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = f * 0.5;
      for(let j = 0; j < 10; j++){
        const th = j * 0.628 + it.i * 1.7 + t * 0.25;
        const rad = f * it.w * 0.55;
        const dx = Math.cos(th) * rad;
        const dy = Math.sin(th) * rad * 0.62;
        const ds = 3 + f * 3;
        ctx.drawImage(SPR[GOLD.i], it.x + dx - ds / 2, it.y + dy - ds / 2, ds, ds);
      }
      ctx.restore();
    }

    drawCard(it);
    photoHit.push(it);
  }
}

function drawCard(it){
  const w = it.w, h = it.h;
  const mat = Math.max(2.5, w * 0.042);
  const iw = w - mat * 2, ih = h - mat * 2;
  const ix = -iw / 2, iy = -ih / 2;

  ctx.save();
  ctx.globalAlpha = it.a > 1 ? 1 : it.a;
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);

  /* 卡纸落在枝头的影子 */
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = Math.max(8, w * 0.18);
  ctx.shadowOffsetY = Math.max(3, h * 0.06);
  ctx.fillStyle = '#efe7d7';
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();

  /* 卡纸本身 */
  const mg = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  mg.addColorStop(0,    '#f5eddd');
  mg.addColorStop(0.55, '#e8dfcd');
  mg.addColorStop(1,    '#dbd0ba');
  ctx.fillStyle = mg;
  ctx.fillRect(-w / 2, -h / 2, w, h);

  /* 照片 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(ix, iy, iw, ih);
  ctx.clip();
  drawCover(it.img, ix, iy, iw, ih);

  const veil = ctx.createLinearGradient(0, iy, 0, iy + ih);
  veil.addColorStop(0,   'rgba(8,10,14,0.14)');
  veil.addColorStop(0.4, 'rgba(8,10,14,0.02)');
  veil.addColorStop(1,   'rgba(8,10,14,0.18)');
  ctx.fillStyle = veil;
  ctx.fillRect(ix, iy, iw, ih);
  ctx.restore();

  /* 三道细线：金边、照片压边、照片暗边 */
  ctx.strokeStyle = 'rgba(186,150,92,0.42)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 + 0.5, -h / 2 + 0.5, w - 1, h - 1);
  ctx.strokeStyle = 'rgba(10,12,16,0.6)';
  ctx.strokeRect(ix - 0.5, iy - 0.5, iw + 1, ih + 1);

  /* 吊在枝头的一根细线 */
  const hook = Math.max(6, h * 0.18);
  ctx.strokeStyle = 'rgba(198,160,100,0.26)';
  ctx.beginPath();
  ctx.moveTo(0, -h / 2 - hook);
  ctx.lineTo(0, -h / 2);
  ctx.stroke();

  ctx.restore();
}

/* ================= 循环 ================= */
let last = performance.now();
let booted = false;

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  t += dt;

  const camT = Math.min(t / 3.6, 1);
  const camE = 1 - Math.pow(1 - camT, 3);
  dist = 63 - 13 * camE;
  ax = 0.14 - 0.065 * camE;

  if(Math.abs(zoom - targetZoom) > 0.0015){
    zoom += (targetZoom - zoom) * Math.min(1, dt * 8);
  }else{
    zoom = targetZoom;
  }

  if(ayGoal !== null){
    const diff = ayGoal - ay;
    ay += diff * Math.min(1, dt * 3.2);
    if(Math.abs(diff) < 0.01) ayGoal = null;
  }else if(autoSpin && !dragging && t > 2.2 && zoom < 1.5){
    ay += dt * 0.085;
  }

  if(snowOn){
    for(let i = 0; i < SNOW.y.length; i++){
      SNOW.y[i] -= SNOW.sp[i] * dt * 1.35;
      if(SNOW.y[i] < TREE.base - 8) SNOW.y[i] = TREE.base + 52;
      SNOW.x[i] += Math.cos(t * 0.5 + SNOW.ph[i]) * dt * 1.2;
    }
  }

  render();

  if(!booted && t > 0.5){
    booted = true;
    boot.classList.add('gone');
    setTimeout(function(){ if(boot.parentNode) boot.remove(); }, 1200);
  }

  requestAnimationFrame(loop);
}

/* ================= DOM ================= */
const masthead = document.getElementById('masthead');
const controls = document.getElementById('controls');
const hintEl = document.getElementById('hint');
const fileInput = document.getElementById('file');
const btnMusic = document.getElementById('btnMusic');
const btnSnow = document.getElementById('btnSnow');
const btnSpin = document.getElementById('btnSpin');
const panel = document.getElementById('panel');
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerCap = document.getElementById('viewerCap');
const shown = { title: false, controls: false, hint: false };

let editing = 0;
let panelOpen = false;
let dragDist = 0;

/* ================= 输入 ================= */
canvas.addEventListener('pointerdown', function(e){
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(pointers.size === 2){
    const p = Array.from(pointers.values());
    pinchStart = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    pinchZoom = targetZoom;
  }
  dragging = true;
  dragDist = 0;
  lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('pointermove', function(e){
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pointers.size === 2){
    const p = Array.from(pointers.values());
    const dd = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if(pinchStart > 0) setZoom(pinchZoom * (dd / pinchStart));
    return;
  }

  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);
  ayGoal = null;
  ay -= dx * 0.0058;
  ax = Math.max(-0.32, Math.min(0.5, ax + dy * 0.0032));
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinchStart = 0;
  dragging = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  setZoom(targetZoom * Math.exp(-e.deltaY * 0.0013));
}, { passive: false });

function setZoom(v){
  targetZoom = Math.max(0.66, Math.min(2.3, v));
  syncMode();
}

function syncMode(){
  controls.classList.toggle('on', t > 4.1);
  if(t > 4.3) hintEl.classList.add('on');
  masthead.classList.toggle('dim', targetZoom > 1.28);
  if(isSmall()){
    hintEl.textContent = targetZoom > 1.45 ? '轻点照片查看 · 双指缩小' : '拖动旋转 · 双指靠近';
  }else{
    hintEl.textContent = targetZoom > 1.45 ? '单击照片查看 · 缩小回到圣诞树' : '拖动旋转 · 滚轮靠近 · 双击落雪';
  }
}

canvas.addEventListener('dblclick', function(){
  snowOn = !snowOn;
  btnSnow.dataset.on = snowOn ? '1' : '0';
});

/* 单击浮出来的照片，看大图 */
canvas.addEventListener('click', function(e){
  if(dragDist > 8) return;
  if(photoHit.length === 0) return;
  for(let i = photoHit.length - 1; i >= 0; i--){
    const it = photoHit[i];
    const dx = e.clientX - it.x, dy = e.clientY - it.y;
    const c = Math.cos(it.rot), s = Math.sin(it.rot);
    const lx =  dx * c + dy * s;
    const ly = -dx * s + dy * c;
    if(Math.abs(lx) <= it.w / 2 + 6 && Math.abs(ly) <= it.h / 2 + 6){
      openViewer(it.i);
      return;
    }
  }
});

function openViewer(i){
  const src = PHOTO.src[i];
  if(!src) return;
  viewerImg.src = src;
  const n = PHOTO.img[i];
  viewerCap.textContent = '第 ' + (i + 1) + ' 张' +
    (n && n.width ? '  ·  ' + n.width + ' × ' + n.height : '');
  viewer.classList.add('open');
}

/* ================= 照片面板 ================= */
function buildPanel(){
  let html = '';
  for(let i = 0; i < MAX_PHOTOS; i++){
    if(PHOTO.src[i]){
      html += '<div class="tile' + (PHOTO.seed[i] ? ' seed' : '') + '" data-i="' + i + '">' +
                '<img src="' + PHOTO.src[i] + '" alt="">' +
                '<span class="idx">' + ('0' + (i + 1)).slice(-2) + '</span>' +
                '<button class="drop" data-drop="' + i + '" title="移除这张">×</button>' +
              '</div>';
    }else{
      html += '<div class="tile empty" data-i="' + i + '">' +
                '<span class="plus">＋</span><span class="lab">放照片</span>' +
              '</div>';
    }
  }
  grid.innerHTML = html;
}

grid.addEventListener('click', function(e){
  const drop = e.target.closest('[data-drop]');
  if(drop){
    e.stopPropagation();
    removePhoto(Number(drop.dataset.drop));
    return;
  }
  const tile = e.target.closest('.tile');
  if(!tile) return;
  const i = Number(tile.dataset.i);
  if(PHOTO.src[i]){
    openViewer(i);
  }else{
    editing = i;
    fileInput.click();
  }
});

function openPanel(){
  panel.classList.add('open');
  panelOpen = true;
}
function closePanel(){
  panel.classList.remove('open');
  panelOpen = false;
}
function closeViewer(){
  viewer.classList.remove('open');
  viewerImg.removeAttribute('src');
}

document.getElementById('panelClose').addEventListener('click', closePanel);
document.getElementById('viewerClose').addEventListener('click', closeViewer);

panel.addEventListener('click', function(e){ if(e.target === panel) closePanel(); });
viewer.addEventListener('click', function(e){ if(e.target === viewer) closeViewer(); });

window.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeViewer(); closePanel(); }
});

/* 拖一张图进来就放进第一个空格子 */
['dragenter', 'dragover'].forEach(function(ev){
  window.addEventListener(ev, function(e){ e.preventDefault(); });
});
window.addEventListener('drop', function(e){
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  let slot = -1;
  for(let i = 0; i < MAX_PHOTOS; i++) if(!PHOTO.src[i]){ slot = i; break; }
  if(slot < 0) slot = 0;
  editing = slot;
  loadFile(f, slot);
});

fileInput.addEventListener('change', function(){
  if(fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0], editing);
  fileInput.value = '';
});

const MAXSIDE = 1100;

function loadFile(file, slot){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const side = Math.max(img.width, img.height);
      let dw = img.width, dh = img.height;
      if(side > MAXSIDE){
        const q = MAXSIDE / side;
        dw = Math.round(dw * q); dh = Math.round(dh * q);
      }
      const cv = document.createElement('canvas');
      cv.width = dw; cv.height = dh;
      cv.getContext('2d').drawImage(img, 0, 0, dw, dh);

      let out = cv.toDataURL('image/jpeg', 0.84);
      if(out.length > 200000) out = cv.toDataURL('image/jpeg', 0.62);

      const im = new Image();
      im.onload = function(){
        PHOTO.img[slot] = im;
        PHOTO.src[slot] = out;
        PHOTO.seed[slot] = false;
        saveStore();
        buildPanel();

        /* 挂好之后，树慢慢转到这张照片正面 */
        const sl = SLOTS[slot];
        let g = Math.PI / 2 - sl.a;
        g += Math.round((ay - g) / (Math.PI * 2)) * Math.PI * 2;
        ayGoal = g;

        if(targetZoom < 1.4) setZoom(1.62);
        syncMode();
      };
      im.src = out;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto(i){
  PHOTO.img[i] = null;
  PHOTO.src[i] = null;
  PHOTO.seed[i] = false;
  saveStore();
  buildPanel();
}

function saveStore(){
  try{
    const data = [];
    for(let i = 0; i < MAX_PHOTOS; i++){
      if(PHOTO.src[i]) data.push([i, PHOTO.src[i], PHOTO.seed[i] ? 1 : 0]);
    }
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(err){ /* 本地存储不可用时，照片只在本次打开有效 */ }
}

/* ================= 初始照片 ================= */
function seedCard(kind){
  const cv = document.createElement('canvas');
  cv.width = 900; cv.height = 600;
  const q = cv.getContext('2d');
  const SERIF = '"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif';

  function spacing(px){ if('letterSpacing' in q) q.letterSpacing = px + 'px'; }
  function star(cx, cy, R, color){
    q.beginPath();
    for(let k = 0; k < 10; k++){
      const ang = -Math.PI / 2 + k * Math.PI / 5;
      const rad = (k % 2 === 0) ? R : R * 0.44;
      const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
      if(k === 0) q.moveTo(px, py); else q.lineTo(px, py);
    }
    q.closePath();
    q.fillStyle = color;
    q.fill();
  }

  if(kind === 0){
    const bg = q.createLinearGradient(0, 0, 0, 600);
    bg.addColorStop(0, '#13241c');
    bg.addColorStop(1, '#08120e');
    q.fillStyle = bg;
    q.fillRect(0, 0, 900, 600);

    const gl = q.createRadialGradient(450, 260, 0, 450, 260, 430);
    gl.addColorStop(0, 'rgba(198,160,100,0.13)');
    gl.addColorStop(1, 'rgba(198,160,100,0)');
    q.fillStyle = gl;
    q.fillRect(0, 0, 900, 600);

    q.strokeStyle = 'rgba(198,160,100,0.46)';
    q.lineWidth = 1;
    q.strokeRect(38, 38, 824, 524);
    q.strokeStyle = 'rgba(198,160,100,0.18)';
    q.strokeRect(46, 46, 808, 508);

    q.textAlign = 'center';
    q.fillStyle = 'rgba(242,233,214,0.94)';
    q.font = '300 104px ' + SERIF;
    q.fillText('M', 450, 305);

    spacing(9);
    q.font = '300 17px ' + SERIF;
    q.fillStyle = 'rgba(232,222,204,0.52)';
    q.fillText('MERRY CHRISTMAS', 450, 356);
    spacing(4);
    q.font = '300 12px ' + SERIF;
    q.fillStyle = 'rgba(198,160,100,0.62)';
    q.fillText('XII · XXV', 450, 396);
    spacing(0);
    star(450, 128, 15, 'rgba(214,178,116,0.72)');
  }

  if(kind === 1){
    const bg = q.createLinearGradient(0, 0, 900, 600);
    bg.addColorStop(0, '#f3ebda');
    bg.addColorStop(0.55, '#ebe1cd');
    bg.addColorStop(1, '#ded2ba');
    q.fillStyle = bg;
    q.fillRect(0, 0, 900, 600);

    q.strokeStyle = 'rgba(28,34,28,0.2)';
    q.lineWidth = 1;
    q.strokeRect(40, 40, 820, 520);

    q.textAlign = 'center';
    spacing(8);
    q.font = '300 14px ' + SERIF;
    q.fillStyle = 'rgba(28,34,28,0.5)';
    q.fillText('CHRISTMAS', 450, 126);

    q.fillStyle = 'rgba(22,26,22,0.9)';
    q.font = '300 96px ' + SERIF;
    spacing(2);
    q.fillText('XXV', 450, 320);

    q.strokeStyle = 'rgba(168,132,72,0.55)';
    q.lineWidth = 1;
    q.beginPath();
    q.moveTo(380, 356); q.lineTo(520, 356);
    q.stroke();

    spacing(6);
    q.font = '300 18px ' + SERIF;
    q.fillStyle = 'rgba(28,34,28,0.62)';
    q.fillText('十二月 · 二十五日', 450, 408);

    spacing(10);
    q.font = '300 12px ' + SERIF;
    q.fillStyle = 'rgba(28,34,28,0.34)';
    q.fillText('A QUIET EVENING', 450, 486);
    spacing(0);
  }

  if(kind === 2){
    const bg = q.createRadialGradient(450, 240, 0, 450, 300, 620);
    bg.addColorStop(0, '#1a2530');
    bg.addColorStop(0.55, '#0c131a');
    bg.addColorStop(1, '#04070a');
    q.fillStyle = bg;
    q.fillRect(0, 0, 900, 600);

    q.strokeStyle = 'rgba(198,160,100,0.38)';
    q.lineWidth = 1;
    q.beginPath();
    q.arc(450, 300, 168, -Math.PI * 0.72, Math.PI * 0.72);
    q.stroke();

    q.fillStyle = 'rgba(214,178,116,0.8)';
    q.beginPath();
    q.arc(450 + Math.cos(-Math.PI * 0.72) * 168, 300 + Math.sin(-Math.PI * 0.72) * 168, 3, 0, Math.PI * 2);
    q.fill();

    q.textAlign = 'center';
    spacing(12);
    q.font = '300 30px ' + SERIF;
    q.fillStyle = 'rgba(240,232,216,0.88)';
    q.fillText('NOËL', 450, 300);

    spacing(3);
    q.font = 'italic 300 17px ' + SERIF;
    q.fillStyle = 'rgba(232,222,204,0.44)';
    q.fillText('douce nuit', 450, 350);

    spacing(8);
    q.font = '300 11px ' + SERIF;
    q.fillStyle = 'rgba(198,160,100,0.55)';
    q.fillText('—  25  —', 450, 470);
    spacing(0);
    star(450, 380, 12, 'rgba(214,178,116,0.5)');
  }

  return cv.toDataURL('image/jpeg', 0.78);
}

function bootPhotos(){
  let restored = false;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) restored = true;
      for(let j = 0; j < arr.length; j++){
        const i = Number(arr[j][0]), src = arr[j][1];
        if(!(i >= 0 && i < MAX_PHOTOS) || typeof src !== 'string') continue;
        const im = new Image();
        im.onload = (function(idx, image){ return function(){ PHOTO.img[idx] = image; }; })(i, im);
        im.src = src;
        PHOTO.src[i] = src;
        PHOTO.seed[i] = !!arr[j][2];
        restored = true;
      }
    }
  }catch(err){ /* file:// 下部分浏览器禁用本地存储，忽略即可 */ }

  if(!restored){
    for(let k = 0; k < 3; k++){
      const src = seedCard(k);
      const im = new Image();
      im.src = src;
      PHOTO.img[k] = im;
      PHOTO.src[k] = src;
      PHOTO.seed[k] = true;
    }
  }

  buildPanel();
}

/* ================= 音乐 ================= */
const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00
};
const MELODY = [
  ['E5',1],['E5',1],['E5',2],
  ['E5',1],['E5',1],['E5',2],
  ['E5',1],['G5',1],['C5',1.5],['D5',0.5],['E5',3],
  ['F5',1],['F5',1],['F5',1.5],['F5',0.5],
  ['F5',1],['E5',1],['E5',1],['E5',0.5],
  ['D5',1],['D5',1],['E5',1],['D5',2],['G5',2]
];
const BEAT = 0.52;
let actx = null, musicOn = false, musicTimer = null;

function bell(freq, when, peak){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0004, when + 1.4);
  g.connect(actx.destination);

  const o1 = actx.createOscillator();
  o1.type = 'triangle';
  o1.frequency.setValueAtTime(freq, when);

  const o2 = actx.createOscillator();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(freq * 2.01, when);
  const g2 = actx.createGain();
  g2.gain.value = 0.26;

  o1.connect(g);
  o2.connect(g2); g2.connect(g);
  o1.start(when); o2.start(when);
  o1.stop(when + 1.5); o2.stop(when + 1.5);
}

function schedule(start){
  let s = start;
  for(let i = 0; i < MELODY.length; i++){
    bell(NOTE[MELODY[i][0]], s, MELODY[i][0] === 'G5' ? 0.045 : 0.032);
    s += MELODY[i][1] * BEAT;
  }
  return s;
}

btnMusic.addEventListener('click', function(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
  }
  if(musicOn){
    musicOn = false;
    clearTimeout(musicTimer);
    actx.suspend();
    btnMusic.dataset.on = '0';
  }else{
    musicOn = true;
    actx.resume();
    (function again(){
      if(!musicOn) return;
      const end = schedule(actx.currentTime + 0.05);
      musicTimer = setTimeout(again, Math.max(80, (end - actx.currentTime - 0.3) * 1000));
    })();
    btnMusic.dataset.on = '1';
  }
});
